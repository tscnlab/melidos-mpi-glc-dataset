name: Validate GLC Dataset

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  validate:
    uses: GlobalLightCommons/glc-framework/.github/workflows/validate.yml@dfd412d54091a70abc597925a5e48c6b71404a08 # framework-v0.1.0
    with:
      datapackage: datapackage.json
